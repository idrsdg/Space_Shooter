<!doctype html>
<html lang="tr">
<head>

<title>Space Shooter</title>
<link rel="icon" href="data:,">
<style>
  :root { --u: 1px; --ink: #eef3ff; --dim: #9fb0d8; --panel: #101633; --line: #33406f; --accent: #ff8a3c; --cool: #49c8f2; }
  html, body { margin: 0; height: 100%; background: #04050f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  #stage { position: relative; overflow: hidden; background: #060818; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hudBtn { position: absolute; display: none; align-items: center; justify-content: center; background: rgba(16, 22, 51, .82); border: calc(var(--u) * 2) solid var(--line); border-radius: calc(var(--u) * 14); padding: 0; }
  #btnPause { top: calc(var(--u) * 12); right: calc(var(--u) * 12); width: calc(var(--u) * 68); height: calc(var(--u) * 68); }
  #btnPause i { display: block; width: calc(var(--u) * 8); height: calc(var(--u) * 26); margin: 0 calc(var(--u) * 4); background: var(--ink); border-radius: calc(var(--u) * 2); }
  #btnBomb { right: calc(var(--u) * 16); bottom: calc(var(--u) * 16); width: calc(var(--u) * 104); height: calc(var(--u) * 104); border-radius: 50%; border-color: var(--accent); flex-direction: column; font-weight: 800; font-size: calc(var(--u) * 19); line-height: 1.1; }
  #btnBomb b { font-size: calc(var(--u) * 32); color: var(--accent); }
  #btnBomb.empty { opacity: .4; border-color: var(--line); }
  .scr { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 14); padding: calc(var(--u) * 28); box-sizing: border-box; text-align: center; }
  .scr.on { display: flex; }
  .scr.dim { background: rgba(5, 7, 22, .78); }
  h1 { margin: 0; font-size: calc(var(--u) * 82); line-height: .95; font-weight: 900; letter-spacing: calc(var(--u) * 2); }
  h1 span { display: block; color: var(--cool); }
  h2 { margin: 0 0 calc(var(--u) * 6); font-size: calc(var(--u) * 50); font-weight: 900; }
  .tag { color: var(--dim); font-size: calc(var(--u) * 22); margin: calc(var(--u) * 4) 0 calc(var(--u) * 250); }
  .btn { width: calc(var(--u) * 380); min-height: calc(var(--u) * 72); background: var(--panel); border: calc(var(--u) * 2) solid var(--line); border-radius: calc(var(--u) * 14); font-size: calc(var(--u) * 27); font-weight: 750; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #1d0d02; }
  .btn:focus-visible, .mini:focus-visible, .buy:focus-visible { outline: calc(var(--u) * 3) solid var(--ink); outline-offset: calc(var(--u) * 2); }
  .row { display: flex; gap: calc(var(--u) * 12); width: calc(var(--u) * 380); }
  .mini { flex: 1; white-space: nowrap; padding: 0 calc(var(--u) * 4); min-height: calc(var(--u) * 62); background: var(--panel); border: calc(var(--u) * 2) solid var(--line); border-radius: calc(var(--u) * 12); font-size: calc(var(--u) * 20); font-weight: 700; }
  .stat { color: var(--dim); font-size: calc(var(--u) * 24); }
  .stat b { color: var(--ink); }
  #overScore { font-size: calc(var(--u) * 66); font-weight: 900; }
  #overRec { color: var(--accent); font-weight: 800; font-size: calc(var(--u) * 26); min-height: calc(var(--u) * 32); }
  #upList { width: 100%; max-width: calc(var(--u) * 540); display: flex; flex-direction: column; gap: calc(var(--u) * 10); }
  .up { display: flex; align-items: center; gap: calc(var(--u) * 12); background: var(--panel); border: calc(var(--u) * 2) solid var(--line); border-radius: calc(var(--u) * 12); padding: calc(var(--u) * 11) calc(var(--u) * 14); text-align: left; }
  .up > div { flex: 1; min-width: 0; }
  .up strong { display: block; font-size: calc(var(--u) * 24); }
  .up small { display: block; color: var(--dim); font-size: calc(var(--u) * 19); line-height: 1.2; }
  .pips { display: flex; gap: calc(var(--u) * 4); margin-top: calc(var(--u) * 6); }
  .pips i { width: calc(var(--u) * 24); height: calc(var(--u) * 7); background: var(--line); border-radius: calc(var(--u) * 2); }
  .pips i.f { background: var(--cool); }
  .buy { min-width: calc(var(--u) * 112); min-height: calc(var(--u) * 62); background: var(--accent); color: #1d0d02; border: 0; border-radius: calc(var(--u) * 10); font-weight: 850; font-size: calc(var(--u) * 22); }
  .buy:disabled { background: #2a3258; color: var(--dim); cursor: default; }
  .allGames { color: var(--dim); font-size: calc(var(--u) * 21); font-weight: 650; padding: calc(var(--u) * 8) calc(var(--u) * 14); text-decoration: underline; text-underline-offset: calc(var(--u) * 4); touch-action: manipulation; }
  #helpBody { width: 100%; max-width: calc(var(--u) * 530); text-align: left; font-size: calc(var(--u) * 22); line-height: 1.32; color: var(--ink); }
  #helpBody p { margin: 0 0 calc(var(--u) * 11); }
  #helpBody b { color: var(--cool); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="btnPause" class="hudBtn" data-act="pause"><i></i><i></i></button>
  <button id="btnBomb" class="hudBtn"><b id="bombN">2</b><span data-t="bomb"></span></button>

  <section id="scrMenu" class="scr">
    <h1>SPACE<span>SHOOTER</span></h1>
    <div class="tag" data-t="tag"></div>
    <button class="btn pri" data-act="continue" id="btnCont"></button>
    <button class="btn" data-act="new" id="btnNew" data-t="play"></button>
    <button class="btn" data-act="hangar" data-t="hangar"></button>
    <div class="row">
      <button class="mini" data-act="help" data-t="how"></button>
      <button class="mini" data-act="sound" data-role="sound"></button>
      <button class="mini" data-act="lang" data-role="lang"></button>
    </div>
    <div class="stat"><span data-t="best"></span>: <b id="menuBest">0</b></div>
    <a class="allGames" href="../games/" data-t="allGames"></a>
  </section>

  <section id="scrHangar" class="scr dim">
    <h2 data-t="hangar"></h2>
    <div class="stat"><span data-t="scrap"></span>: <b id="hangarScrap">0</b></div>
    <div id="upList"></div>
    <button class="btn" data-act="back" data-t="back"></button>
  </section>

  <section id="scrHelp" class="scr dim">
    <h2 data-t="how"></h2>
    <div id="helpBody"></div>
    <button class="btn" data-act="back" data-t="back"></button>
  </section>

  <section id="scrPause" class="scr dim">
    <h2 data-t="paused"></h2>
    <button class="btn pri" data-act="resume" data-t="resume"></button>
    <button class="btn" data-act="restart" data-t="restart"></button>
    <div class="row">
      <button class="mini" data-act="sound" data-role="sound"></button>
      <button class="mini" data-act="lang" data-role="lang"></button>
    </div>
    <button class="btn" data-act="quit" data-t="quit"></button>
    <a class="allGames" href="../games/" data-t="allGames"></a>
  </section>

  <section id="scrOver" class="scr dim">
    <h2 data-t="over"></h2>
    <div id="overScore">0</div>
    <div id="overRec"></div>
    <div class="stat"><span data-t="best"></span>: <b id="overBest">0</b></div>
    <div class="stat"><span data-t="reached"></span>: <b id="overSector">1</b></div>
    <div class="stat"><span data-t="scrapGot"></span>: <b id="overScrap">0</b></div>
    <button class="btn pri" data-act="new" data-t="again"></button>
    <button class="btn" data-act="hangar" data-t="hangar"></button>
    <button class="btn" data-act="menu" data-t="menu"></button>
  </section>
</div>
<script>
(() => {
  'use strict';

  // ---------- temel ----------
  const W = 600;
  let H = 900, scale = 1, k = 1;
  const TAU = Math.PI * 2, PI = Math.PI;
  const { sin, cos, atan2, floor, ceil, min, max, abs, sqrt, random, round } = Math;
  const rnd = (a, b) => a + random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const $ = id => document.getElementById(id);
  const cv = $('c'), g = cv.getContext('2d', { alpha: false }), stage = $('stage');

  // ---------- dil ----------
  const TXT = {
    tr: {
      tag: 'Filoyu durdur, sektörleri geri al', allGames: 'Tüm oyunlar', play: 'Yeni Oyun', cont: 'Devam Et', hangar: 'Hangar', how: 'Nasıl?', back: 'Geri',
      soundOn: 'Ses: Açık', soundOff: 'Ses: Kapalı', best: 'En iyi', scrap: 'Hurda', paused: 'Duraklatıldı', resume: 'Devam Et', restart: 'Yeniden Başla',
      quit: 'Ana Menü (kayıtlı)', over: 'Gemi Düştü', again: 'Tekrar Oyna', menu: 'Ana Menü', reached: 'Ulaşılan sektör', scrapGot: 'Toplanan hurda', newBest: 'Yeni rekor!',
      bomb: 'NOVA', sector: 'SEKTÖR', wave: 'DALGA', warning: 'UYARI', cleared: 'SEKTÖR TEMİZ', bestH: 'EN İYİ', lvl: 'Sv', max: 'TAM',
      u_hull: 'Gövde', ud_hull: 'Başlangıçta +1 gövde', u_cannon: 'Top', ud_cannon: 'Daha güçlü topla başla', u_rocket: 'Roket', ud_rocket: 'Roketlerle başla',
      u_magnet: 'Mıknatıs', ud_magnet: 'Hurda ve kapsülleri uzaktan çek', u_bomb: 'Nova Deposu', ud_bomb: 'Başlangıçta +1 Nova',
      p_w: 'TOP +1', p_r: 'ROKET +1', p_s: 'KALKAN', p_h: 'ONARIM', p_b: 'NOVA +1', p_o: 'AŞIRI GÜÇ', boss0: 'KOR PENÇE', boss1: 'GİRDAP ÇEKİRDEĞİ', boss2: 'SESSİZ TAHT',
      help: ['<b>Klavye:</b> Yön tuşları veya WASD ile uç, Boşluk ile ateş et, X ile Nova, P ile duraklat, M ile ses.', '<b>Fare:</b> Gemi imleci izler, sol tuş ateş, sağ tuş Nova.', '<b>Dokunmatik:</b> Parmağını ekranda sürükle, gemi kendi ateş eder. Nova sağ altta.', '<b>Kapsüller:</b> Top, roket, kalkan, onarım, Nova ve aşırı güç düşer.', '<b>Zincir:</b> Art arda vurdukça skor çarpanı 8 katına çıkar, hasar alınca sıfırlanır.', '<b>Hurda:</b> Hangarda kalıcı geliştirmelere harca. Her dalgada ilerlemen kaydedilir.']
    },
    en: {
      tag: 'Stop the fleet, take the sectors back', allGames: 'All games', play: 'New Game', cont: 'Continue', hangar: 'Hangar', how: 'How?', back: 'Back',
      soundOn: 'Sound: On', soundOff: 'Sound: Off', best: 'Best', scrap: 'Scrap', paused: 'Paused', resume: 'Resume', restart: 'Restart',
      quit: 'Main Menu (saved)', over: 'Ship Down', again: 'Play Again', menu: 'Main Menu', reached: 'Sector reached', scrapGot: 'Scrap collected', newBest: 'New record!',
      bomb: 'NOVA', sector: 'SECTOR', wave: 'WAVE', warning: 'WARNING', cleared: 'SECTOR CLEAR', bestH: 'BEST', lvl: 'Lv', max: 'MAX',
      u_hull: 'Hull', ud_hull: '+1 hull at start', u_cannon: 'Cannon', ud_cannon: 'Start with a stronger cannon', u_rocket: 'Rockets', ud_rocket: 'Start with rockets',
      u_magnet: 'Magnet', ud_magnet: 'Pull scrap and capsules from afar', u_bomb: 'Nova Rack', ud_bomb: '+1 Nova at start',
      p_w: 'CANNON +1', p_r: 'ROCKET +1', p_s: 'SHIELD', p_h: 'REPAIR', p_b: 'NOVA +1', p_o: 'OVERDRIVE', boss0: 'EMBER CLAW', boss1: 'VORTEX CORE', boss2: 'SILENT THRONE',
      help: ['<b>Keyboard:</b> Arrows or WASD to fly, Space to fire, X for Nova, P to pause, M for sound.', '<b>Mouse:</b> The ship follows the cursor, left button fires, right button launches Nova.', '<b>Touch:</b> Drag anywhere and the ship fires on its own. Nova is bottom right.', '<b>Capsules:</b> Cannon, rocket, shield, repair, Nova and overdrive drop from enemies.', '<b>Chain:</b> Keep hitting to raise the score multiplier up to 8x. Taking damage resets it.', '<b>Scrap:</b> Spend it on permanent Hangar upgrades. Your run is saved every wave.']
    }
  };

  // ---------- kayıt ----------
  const KEY = 'spaceShooter.v2';
  const UPS = [
    { id: 'hull', max: 3, cost: [60, 160, 340] },
    { id: 'cannon', max: 3, cost: [80, 220, 460] },
    { id: 'rocket', max: 3, cost: [100, 260, 520] },
    { id: 'magnet', max: 3, cost: [50, 140, 300] },
    { id: 'bomb', max: 2, cost: [120, 320] }
  ];
  const Save = { best: 0, bestSector: 1, scrap: 0, up: { hull: 0, cannon: 0, rocket: 0, magnet: 0, bomb: 0 }, lang: '', mute: false, run: null };
  const num = (v, d) => (typeof v === 'number' && isFinite(v) && v >= 0) ? floor(v) : d;
  function loadSave() {
    try {
      const o = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (o && typeof o === 'object') {
        Save.best = num(o.best, 0); Save.bestSector = max(1, num(o.bestSector, 1)); Save.scrap = num(o.scrap, 0);
        if (o.up) for (const u of UPS) Save.up[u.id] = clamp(num(o.up[u.id], 0), 0, u.max);
        if (o.lang === 'tr' || o.lang === 'en') Save.lang = o.lang;
        Save.mute = o.mute === true;
        const r = o.run;
        if (r && typeof r === 'object' && num(r.sector, 0) >= 1 && num(r.wave, 0) >= 1 && num(r.hull, 0) >= 1) {
          Save.run = { score: num(r.score, 0), sector: num(r.sector, 1), wave: clamp(num(r.wave, 1), 1, 6), hull: num(r.hull, 1), maxHull: max(num(r.maxHull, 3), 1), shield: clamp(num(r.shield, 0), 0, 3), wpn: clamp(num(r.wpn, 1), 1, 6), rkt: clamp(num(r.rkt, 0), 0, 3), bombs: clamp(num(r.bombs, 0), 0, 6), gain: num(r.gain, 0) };
          Save.run.hull = min(Save.run.hull, Save.run.maxHull);
        }
      } else {
        Save.best = num(+localStorage.getItem('spaceShooterBest'), 0);
      }
    } catch (e) { /* kayıt okunamazsa varsayılanla devam */ }
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(Save)); } catch (e) { /* depolama kapalı olabilir */ } }
  loadSave();
  let lang = Save.lang || (/^tr/i.test(navigator.language || '') ? 'tr' : 'en');
  const t = key => TXT[lang][key];

  // ---------- ses ----------
  const Snd = (() => {
    let ac = null, master = null, noise = null;
    const last = {};
    function ensure() {
      if (Save.mute) return false;
      if (!ac) {
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain(); master.gain.value = .55;
          const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
          const n = ac.sampleRate, b = ac.createBuffer(1, n, n), d = b.getChannelData(0);
          for (let i = 0; i < n; i++) d[i] = random() * 2 - 1;
          noise = b;
        } catch (e) { ac = null; return false; }
      }
      if (ac.state === 'suspended') ac.resume();
      return true;
    }
    function gate(id, gap) { const now = ac.currentTime; if (last[id] && now - last[id] < gap) return false; last[id] = now; return true; }
    function tone(f0, f1, dur, type, vol, delay) {
      const at = ac.currentTime + (delay || 0), o = ac.createOscillator(), v = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(max(20, f1), at + dur);
      v.gain.setValueAtTime(.0001, at); v.gain.exponentialRampToValueAtTime(vol, at + .006); v.gain.exponentialRampToValueAtTime(.0001, at + dur);
      o.connect(v); v.connect(master); o.start(at); o.stop(at + dur + .02);
    }
    function burst(dur, vol, f0, f1, type) {
      const at = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
      s.buffer = noise; s.loop = true; f.type = type || 'lowpass';
      f.frequency.setValueAtTime(f0, at); f.frequency.exponentialRampToValueAtTime(max(40, f1), at + dur);
      v.gain.setValueAtTime(vol, at); v.gain.exponentialRampToValueAtTime(.0001, at + dur);
      s.connect(f); f.connect(v); v.connect(master); s.start(at, random() * .8); s.stop(at + dur + .02);
    }
    const defs = {
      shot() { if (gate('shot', .07)) tone(1250, 340, .075, 'square', .035); },
      rocket() { if (gate('rocket', .12)) { burst(.22, .1, 2600, 500, 'bandpass'); tone(170, 420, .18, 'sawtooth', .025); } },
      hit() { if (gate('hit', .05)) tone(520, 240, .04, 'triangle', .05); },
      armor() { if (gate('armor', .08)) tone(1500, 900, .05, 'square', .025); },
      small() { if (gate('small', .05)) { burst(.24, .26, 2200, 180); tone(190, 45, .18, 'triangle', .14); } },
      big() { if (gate('big', .1)) { burst(.6, .46, 1400, 60); tone(110, 28, .5, 'sine', .34); } },
      huge() { burst(1.5, .6, 900, 30); tone(80, 20, 1.3, 'sine', .46); },
      enemy() { if (gate('enemy', .11)) tone(420, 170, .1, 'sawtooth', .018); },
      beam() { if (gate('beam', .3)) { tone(90, 720, .5, 'sawtooth', .04); } },
      pick() { if (gate('pick', .035)) tone(1250, 1850, .05, 'sine', .035); },
      power() { tone(520, 780, .09, 'triangle', .1); tone(780, 1170, .13, 'triangle', .1, .08); },
      hurt() { burst(.4, .42, 900, 90); tone(240, 50, .35, 'sawtooth', .12); },
      shieldHit() { tone(900, 300, .22, 'triangle', .13); },
      nova() { burst(1.1, .55, 3200, 50); tone(60, 500, .3, 'sawtooth', .12); tone(500, 30, .9, 'sine', .36, .25); },
      warn() { for (let i = 0; i < 3; i++) { tone(440, 440, .24, 'square', .05, i * .42); tone(330, 330, .18, 'square', .05, i * .42 + .2); } },
      clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .22, 'triangle', .1, i * .11)); },
      ui() { tone(700, 980, .05, 'triangle', .06); }
    };
    return { play(id) { if (!ensure()) return; try { defs[id](); } catch (e) { /* ses hatası oyunu durdurmasın */ } }, unlock() { ensure(); } };
  })();

  // ---------- nesne havuzu ----------
  function Pool(cap, proto) { this.a = []; for (let i = 0; i < cap; i++) this.a.push(Object.assign({ dead: false }, proto)); this.n = 0; }
  Pool.prototype.get = function () { if (this.n >= this.a.length) return null; const o = this.a[this.n++]; o.dead = false; return o; };
  Pool.prototype.sweep = function () { const a = this.a; let i = 0; while (i < this.n) { if (a[i].dead) { const l = --this.n, x = a[i]; a[i] = a[l]; a[l] = x; } else i++; } };
  Pool.prototype.clear = function () { this.n = 0; };

  const pb = new Pool(220, { x: 0, y: 0, vx: 0, vy: 0, ang: 0, dmg: 1, heavy: false });
  const rk = new Pool(40, { x: 0, y: 0, ang: 0, v: 0, t: 0, rt: 0, tg: null, smoke: 0, side: 1 });
  const eb = new Pool(520, { x: 0, y: 0, vx: 0, vy: 0, acc: 0, ang: 0, kind: 0, r: 6, t: 0 });
  const en = new Pool(70, { type: '', def: null, x: 0, y: 0, vx: 0, vy: 0, hp: 0, maxHp: 0, t: 0, path: 0, a: 0, b: 0, c: 0, d: 0, fireT: 0, flash: 0, rot: 0, spin: 0, shield: 0, st: 0, var: 0, px: 0, smoke: 0 });
  const sq = new Pool(140, { t: 0, type: '', x: 0, y: 0, path: 0, a: 0, b: 0, c: 0, d: 0 });
  const pu = new Pool(90, { x: 0, y: 0, vx: 0, vy: 0, kind: '', t: 0, scrap: false, v: 1 });
  const fx = new Pool(1100, { kind: 0, x: 0, y: 0, vx: 0, vy: 0, t: 0, life: 1, s: 1, rot: 0, vr: 0, col: 0, drag: 1 });
  const bm = new Pool(10, { owner: null, ox: 0, oy: 0, ang: 0, va: 0, t: 0, warn: .7, life: 1, w: 14, hit: false });
  const fl = new Pool(10, { key: '', x: 0, y: 0, t: 0 });

  // ---------- sprite çizimi ----------
  const SS = 2;
  function mk(w, h, fn) {
    const c = document.createElement('canvas'); c.width = ceil(w * SS); c.height = ceil(h * SS);
    const x = c.getContext('2d'); x.scale(SS, SS); x.translate(w / 2, h / 2); x.lineJoin = 'round'; x.lineCap = 'round';
    fn(x, w, h); return { c, w, h };
  }
  function whiteOf(s, amt) {
    const c = document.createElement('canvas'); c.width = s.c.width; c.height = s.c.height;
    const x = c.getContext('2d'); x.drawImage(s.c, 0, 0); x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(255,236,214,' + (amt || .5) + ')'; x.fillRect(0, 0, c.width, c.height);
    return { c, w: s.w, h: s.h };
  }
  function LG(x, x0, y0, x1, y1, ...s) { const r = x.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < s.length; i += 2) r.addColorStop(s[i], s[i + 1]); return r; }

    return UNLOCK[clamp(idx, 0, n - 1)][0];
  }
  function buildWave() {
    const L = (R.sector - 1) * 5 + R.wave;
    const groups = clamp(2 + floor(L * .42), 2, 8);
    const gap = max(.75, 1.9 - L * .05);
    let at = 1;
    for (let i = 0; i < groups; i++) at += patternFor(i === 0 && L > 2 ? UNLOCK[min(UNLOCK.length - 1, floor(random() * 3))][0] : pickType(L), at, L) + gap;
  }

  // ---------- efekt ----------
  function part(kind, x, y, vx, vy, life, s, col) {
    const f = fx.get(); if (!f) return null;
    f.kind = kind; f.x = x; f.y = y; f.vx = vx; f.vy = vy; f.t = 0; f.life = life; f.s = s; f.col = col | 0; f.rot = random() * TAU; f.vr = rnd(-7, 7); f.drag = 1;
    return f;
  }
  function sparks(x, y, n, sp, col) {
    for (let i = 0; i < n; i++) { const a = random() * TAU, v = sp * (.35 + random() * .65); const f = part(0, x, y, cos(a) * v, sin(a) * v, rnd(.14, .36), rnd(.8, 1.6), col); if (f) f.drag = 4; }
  }
  const SPARK = ['#ffe28a', '#ff9a3d', '#9fe9ff', '#ff7ad0', '#c8ff7a', '#ffffff'];
  function explosion(x, y, size) {
    const flash = part(4, x, y, 0, 0, .09 + size * .02, .55 + size * .42, 0); if (flash) flash.vr = 0;
    const puffs = 4 + size * 5;
    for (let i = 0; i < puffs; i++) {
      const a = random() * TAU, d = random() * 12 * size, v = (18 + random() * 52) * (.6 + size * .55);
      const f = part(1, x + cos(a) * d, y + sin(a) * d, cos(a) * v, sin(a) * v, rnd(.42, .78) + size * .08, rnd(.34, .68) * (.65 + size * .32), 0);
      if (f) { f.t = -random() * .11 * size; f.drag = 2.6; f.vr = rnd(-1.6, 1.6); }
    }
    for (let i = 0; i < 3 * size + 1; i++) { const a = random() * TAU, v = rnd(70, 230) + size * 24; const f = part(2, x, y, cos(a) * v, sin(a) * v, rnd(.5, 1.05), rnd(.6, 1.2), floor(random() * 4)); if (f) f.drag = 1.5; }
    sparks(x, y, 6 + size * 5, 200 + size * 90, 0);
    const ring = part(3, x, y, 0, 0, .3 + size * .05, 14 + size * 26, 0); if (ring) ring.vr = 0;
  }
  const addShake = v => { S.shake = min(1, S.shake + v); };
  function floater(key, x, y) { const f = fl.get(); if (!f) return; f.key = key; f.x = x; f.y = y; f.t = 0; }

  // ---------- skor ve ödül ----------
  function addScore(v) { R.score += v * R.combo; }
  function chainUp() { R.chain++; R.combo = min(8, 1 + floor(R.chain / 8)); R.comboT = 2.8; }
  function dropPickup(kind, x, y) {
    const p = pu.get(); if (!p) return;
    p.kind = kind; p.x = x; p.y = y; p.vx = rnd(-40, 40); p.vy = rnd(-60, -10); p.t = 0; p.scrap = false; p.v = 0;
  }
  function dropScrap(n, x, y) {
    for (let i = 0; i < n; i++) {
      const p = pu.get(); if (!p) return;
      const a = random() * TAU, v = rnd(30, 130);
      p.kind = 'scrap'; p.x = x; p.y = y; p.vx = cos(a) * v; p.vy = sin(a) * v - 30; p.t = random() * 3; p.scrap = true; p.v = floor(random() * 3);
    }
  }
  function rollDrop(x, y, weight) {
    R.pity += weight;
    if (R.pity < 12 && random() > weight * .018) return;
    R.pity = 0;
    const needW = R.wpn < 6, needR = R.rkt < 3, needH = R.hull < R.maxHull, roll = random();
    let kind = 's';
    if (needH && R.hull <= 1) kind = 'h';
    else if (needW && roll < .34) kind = 'w';
    else if (needR && roll < .56) kind = 'r';
    else if (needH && roll < .68) kind = 'h';
    else if (roll < .8) kind = 's';
    else if (roll < .9) kind = 'b';
    else kind = 'o';
    dropPickup(kind, x, y);
  }
  function applyPickup(kind) {
    if (kind === 'w') { R.wpn = min(6, R.wpn + 1); floater('p_w', Pl.x, Pl.y - 60); }
    else if (kind === 'r') { R.rkt = min(3, R.rkt + 1); floater('p_r', Pl.x, Pl.y - 60); }
    else if (kind === 's') { R.shield = min(3, R.shield + 1); floater('p_s', Pl.x, Pl.y - 60); }
    else if (kind === 'h') { R.hull = min(R.maxHull, R.hull + 1); floater('p_h', Pl.x, Pl.y - 60); }
    else if (kind === 'b') { R.bombs = min(6, R.bombs + 1); floater('p_b', Pl.x, Pl.y - 60); syncBomb(); }
    else if (kind === 'o') { R.overT = 8; floater('p_o', Pl.x, Pl.y - 60); }
    Snd.play('power');
  }

  // ---------- düşman ateşi ----------
  function shoot(x, y, ang, spd, kind, acc) {
    const b = eb.get(); if (!b) return;
    b.x = x; b.y = y; b.vx = cos(ang) * spd; b.vy = sin(ang) * spd; b.acc = acc || 0; b.ang = ang; b.kind = kind; b.r = A.ebR[kind]; b.t = 0;
  }
  const aim = (x, y) => atan2(Pl.y - y, Pl.x - x);

  function ringShots(x, y, n, off, spd, kind) { for (let i = 0; i < n; i++) shoot(x, y, off + i / n * TAU, spd, kind); }
  function addBeam(owner, ox, oy, ang, va, warn, life, w) {
    const b = bm.get(); if (!b) return;
    b.owner = owner; b.ox = ox; b.oy = oy; b.ang = ang; b.va = va; b.t = 0; b.warn = warn; b.life = life; b.w = w; b.hit = false;
  }
  function enemyFire(e) {
    const bs = bulletMul();
    switch (e.type) {
      case 'wasp': shoot(e.x, e.y + 20, aim(e.x, e.y), 250 * bs, 0); Snd.play('enemy'); break;
      case 'splitter': fan(e.x, e.y + 22, aim(e.x, e.y), 2, .32, 235 * bs, 0); Snd.play('enemy'); break;
      case 'orb': ringShots(e.x, e.y, 6 + min(4, R.sector - 1), e.rot, 165 * bs, 1); Snd.play('enemy'); break;
      case 'bomber': { const m = spawnEnemy('mine', e.x, e.y + 30, 0, rnd(-30, 30)); if (m) m.vy = 92; fan(e.x, e.y + 36, PI / 2, 3, .5, 215 * bs, 2); Snd.play('enemy'); break; }
      case 'lancer': addBeam(e, 0, 40, PI / 2, 0, .8, .55, 13); Snd.play('beam'); break;
      case 'warden': fan(e.x, e.y + 26, aim(e.x, e.y), 3, .46, 245 * bs, 3); Snd.play('enemy'); break;
    }
  }

  // ---------- boss ----------
  const BOSS_ATK = {
    clawAim: { n: 6, gap: .24, rest: .75, f(i) { const p = B.parts[i % 2]; if (p.alive) { fan(p.x, p.y + 44, aim(p.x, p.y), 3, .3, 275 * bulletMul(), 0); Snd.play('enemy'); } else if (i % 2 === 0) { shoot(B.x, B.y + 60, aim(B.x, B.y), 300 * bulletMul(), 3); } } },
    clawFan: { n: 3, gap: .52, rest: .85, f(i) { fan(B.x, B.y + 60, PI / 2 + (i - 1) * .12, 9, 1.5, 205 * bulletMul(), 3); Snd.play('enemy'); } },
    clawSpiral: { n: 34, gap: .065, rest: 1, f(i) { const a = i * .36; shoot(B.x, B.y + 20, a, 185 * bulletMul(), 0); shoot(B.x, B.y + 20, a + PI, 185 * bulletMul(), 1); if (i % 3 === 0) Snd.play('enemy'); } },
    vSpiral: { n: 44, gap: .06, rest: .9, f(i) { for (let j = 0; j < B.nparts; j++) { const p = B.parts[j]; if (p.alive) shoot(p.x, p.y, B.rot * 2.2 + j * TAU / 3 + i * .05, 195 * bulletMul(), 1); } if (i % 3 === 0) Snd.play('enemy'); } },
    vRing: { n: 4, gap: .62, rest: .8, f(i) { const a0 = aim(B.x, B.y), n = 22; for (let j = 0; j < n; j++) { if (abs(j - n / 2) < 2) continue; shoot(B.x, B.y, a0 + PI + j / n * TAU + i * .07, 175 * bulletMul(), 4); } Snd.play('enemy'); } },
    vMines: { n: 3, gap: .42, rest: .7, f(i) { const m = spawnEnemy('mine', B.x + (i - 1) * 110, B.y + 40, 0, (i - 1) * 40); if (m) m.vy = 95; shoot(B.x, B.y, aim(B.x, B.y), 280 * bulletMul(), 2); } },
    tWall: { n: 4, gap: .76, rest: .7, f() { const gapX = clamp(Pl.x + rnd(-120, 120), 70, W - 70), bs = 170 * bulletMul(); for (let x = 16; x < W; x += 36) { if (abs(x - gapX) < 62) continue; const b = eb.get(); if (b) { b.x = x; b.y = B.y + 80; b.vx = 0; b.vy = bs; b.acc = 0; b.ang = PI / 2; b.kind = 2; b.r = A.ebR[2]; b.t = 0; } } Snd.play('enemy'); } },
    tBeams: { n: 1, gap: .2, rest: 2.5, f() { for (let j = 0; j < 2; j++) { const p = B.parts[j]; if (p.alive || j === 0) { const dir = j ? -1 : 1, ox = p.alive ? p.x - B.x : 0, oy = p.alive ? p.y - B.y + 46 : 70; addBeam(B, ox, oy, PI / 2 + dir * .75, -dir * .5, .85, 1.6, 15); } } Snd.play('beam'); } },
    tRockets: { n: 4, gap: .36, rest: .9, f(i) { const p = B.parts[i % 2]; const x = p.alive ? p.x : B.x + (i % 2 ? 80 : -80), y = (p.alive ? p.y : B.y) + 40, m = spawnEnemy('srocket', x, y, 5, 0); if (m) m.d = rnd(1.6, 2.4); Snd.play('rocket'); } },
    tFan: { n: 5, gap: .3, rest: .8, f() { fan(B.x, B.y + 76, aim(B.x, B.y + 76), 5, .62, 270 * bulletMul(), 3); Snd.play('enemy'); } }
  };
  const BOSS_PLAN = [
    [['clawAim', 'clawFan'], ['clawAim', 'clawSpiral', 'clawFan'], ['clawSpiral', 'clawFan', 'clawAim', 'clawSpiral']],
    [['vRing', 'vSpiral'], ['vSpiral', 'vMines', 'vRing'], ['vSpiral', 'vRing', 'vMines', 'vSpiral']],
    [['tWall', 'tFan'], ['tBeams', 'tWall', 'tRockets'], ['tBeams', 'tRockets', 'tWall', 'tFan']]
  ];
  function startBoss() {
    const ty = (R.sector - 1) % 3;
    const lvl = 1 + (R.sector - 1) * .55;
    Object.assign(B, { active: true, dead: false, type: ty, x: W / 2, y: -210, t: 0, state: 'enter', phase: 0, atk: -1, cur: null, sub: 0, subI: 0, subT: 1, rot: 0, flash: 0, a: 0, dieT: 0, boomT: 0, baseY: ty === 2 ? 215 : 225 });
    B.r = ty === 0 ? 74 : ty === 1 ? 64 : 88;
    B.maxHp = B.hp = round([260, 340, 420][ty] * lvl);
    B.nparts = ty === 1 ? 3 : 2;
    for (let i = 0; i < 3; i++) { const p = B.parts[i], on = i < B.nparts; p.alive = on; p.max = p.hp = round((ty === 1 ? 46 : 56) * lvl); p.flash = 0; p.r = ty === 1 ? 27 : 31; p.x = -500; p.y = -500; p.ang = 0; }
    showBanner(true); Snd.play('warn');
  }
  function bossDamage(dmg, x, y, part) {
    if (!B.active || B.state !== 'fight') return;
    if (part) {
      part.hp -= dmg; part.flash = .07;
      if (part.hp <= 0 && part.alive) {
        part.alive = false; explosion(part.x, part.y, 3); addShake(.4); Snd.play('big'); addScore(600); chainUp();
        dropPickup(random() < .5 ? 'w' : 's', part.x, part.y); dropScrap(6, part.x, part.y);
      } else Snd.play('hit');
      return;
    }
    B.hp -= dmg; B.flash = .06; Snd.play('hit');
    const ratio = B.hp / B.maxHp, ph = ratio > .66 ? 0 : ratio > .33 ? 1 : 2;
    if (ph !== B.phase) { B.phase = ph; B.atk = -1; B.sub = 0; B.subT = .9; explosion(B.x + rnd(-60, 60), B.y + rnd(-30, 30), 3); addShake(.45); Snd.play('big'); clearEnemyShots(); }
    if (B.hp <= 0) { B.hp = 0; B.state = 'dying'; B.dieT = 0; B.boomT = 0; S.slow = .9; clearEnemyShots(); for (let i = 0; i < bm.n; i++) bm.a[i].dead = true; for (let i = 0; i < en.n; i++) if (en.a[i].type === 'mine' || en.a[i].type === 'srocket') en.a[i].dead = true; }
  }
  function clearEnemyShots() { for (let i = 0; i < eb.n; i++) { const b = eb.a[i]; if (!b.dead) { b.dead = true; if (i % 3 === 0) { const f = part(0, b.x, b.y, rnd(-50, 50), rnd(-50, 50), .25, 1, 1); if (f) f.drag = 4; } } } }
  function updBoss(dt) {
    if (!B.active) return;
    B.t += dt; B.flash = max(0, B.flash - dt);
    B.rot += dt * (B.type === 1 ? (.75 + B.phase * .22) : .55);
    if (B.state === 'enter') {
      B.y += (B.baseY - B.y) * min(1, dt * 1.5);
      if (B.baseY - B.y < 3) { B.state = 'fight'; B.t = 0; }
    } else if (B.state === 'fight') {
      B.x = W / 2 + sin(B.t * (.44 + B.phase * .08)) * (W * .22);
      B.y = B.baseY + sin(B.t * .9) * 14;
      B.subT -= dt;
      let guard = 0;
      while (B.subT <= 0 && guard++ < 4 && Pl.alive) {
        if (B.sub <= 0) {
          const list = BOSS_PLAN[B.type][B.phase]; B.atk = (B.atk + 1) % list.length; B.cur = BOSS_ATK[list[B.atk]]; B.sub = B.cur.n; B.subI = 0;
        }
        B.cur.f(B.subI); B.subI++; B.sub--;
        B.subT += B.sub > 0 ? B.cur.gap : B.cur.rest * max(.6, 1 - (R.sector - 1) * .05) * (B.phase === 2 ? .8 : 1);
      }
    } else if (B.state === 'dying') {
      B.dieT += dt; B.boomT -= dt; B.y += 16 * dt; B.x += sin(B.dieT * 34) * 1.2;
      if (B.boomT <= 0) { B.boomT = .13; explosion(B.x + rnd(-120, 120), B.y + rnd(-70, 70), floor(rnd(2, 4))); addShake(.14); Snd.play('big'); }
      if (B.dieT > 2.1) finishBoss();
    }
    // parçaları gövdeye bağla
    for (let i = 0; i < B.nparts; i++) {
      const p = B.parts[i]; p.flash = max(0, p.flash - dt);
      if (B.type === 0) { const s = i ? 1 : -1, sw = sin(B.t * 1.6 + i) * .14; p.x = B.x + s * (140 + sw * 34); p.y = B.y + 26 + cos(B.t * 1.6 + i) * 8; p.ang = s * (-.16 + sw); }
      else if (B.type === 1) { const a = B.rot + i * TAU / 3; p.x = B.x + cos(a) * 112; p.y = B.y + sin(a) * 112; p.ang = a + PI / 2; }
      else { const s = i ? 1 : -1; p.x = B.x + s * 118; p.y = B.y + 42 + sin(B.t * 2.2 + i * 2) * 3; p.ang = sin(B.t * 1.1 + i) * .08; }
    }
  }
  function finishBoss() {
    explosion(B.x, B.y, 5); explosion(B.x - 80, B.y + 10, 4); explosion(B.x + 80, B.y - 10, 4); addShake(1); Snd.play('huge');
    addScore(2500 * R.sector); chainUp(); dropScrap(18, B.x, B.y);
    dropPickup('h', B.x - 60, B.y); dropPickup(R.wpn < 6 ? 'w' : 's', B.x, B.y); dropPickup(R.rkt < 3 ? 'r' : 'b', B.x + 60, B.y);

  }

  // ---------- akış ----------
  let bannerSpr = null;
  const bannerCanvas = document.createElement('canvas');
  function showBanner(boss, cleared) {

    const x = c.getContext('2d'); x.scale(2, 2); x.textAlign = 'center'; x.textBaseline = 'middle';
    if (boss) {
      x.fillStyle = 'rgba(30,8,12,.9)'; x.fillRect(0, 22, 600, 106);

      x.fillStyle = '#fff'; x.font = '800 26px system-ui, sans-serif'; x.strokeStyle = '#0a0f22'; x.lineWidth = 5; const s = t('sector') + ' ' + R.sector; x.strokeText(s, 300, 108); x.fillText(s, 300, 108);
    } else {
      x.fillStyle = '#fff'; x.strokeStyle = '#0a0f22'; x.lineWidth = 7; x.lineJoin = 'round'; x.font = '900 42px system-ui, sans-serif'; const s = t('sector') + ' ' + R.sector; x.strokeText(s, 300, 58); x.fillText(s, 300, 58);
      x.fillStyle = '#7fe0ff'; x.font = '800 26px system-ui, sans-serif'; x.lineWidth = 5; const w = t('wave') + ' ' + R.wave + ' / 5'; x.strokeText(w, 300, 100); x.fillText(w, 300, 100);
    }
    bannerSpr = { c, w: 600, h: 150 };

  }
  function startWave() {

  }
  function saveRun() {

  }
  function startRun(resume) {

    const u = Save.up;
    R.maxHull = 3 + u.hull; R.hull = R.maxHull; R.shield = 0; R.wpn = 1 + u.cannon; R.rkt = u.rocket; R.bombs = 2 + u.bomb; R.score = 0; R.sector = 1; R.wave = 1; S.gain = 0;

  function setMode(m) {

  }
  let backTo = 'menu', menuY = 400;
  function measureMenu() {

    for (let i = 0; i < 3; i++) { const x = 18 + i * 25; g.fillStyle = '#0a0f22'; g.fillRect(x, by - 38, 22, 15); g.fillStyle = i < R.shield ? '#49c8f2' : '#262c4e'; g.fillRect(x + 2, by - 36, 18, 11); }
    for (let i = 0; i < 6; i++) { g.fillStyle = i < R.wpn ? '#ff9a3d' : '#262c4e'; g.fillRect(104 + i * 11, by - 38, 8, 15); }
    for (let i = 0; i < 3; i++) { g.fillStyle = i < R.rkt ? '#ef3e45' : '#262c4e'; g.fillRect(180 + i * 11, by - 38, 8, 15); }
    if (R.overT > 0) { g.fillStyle = '#26305a'; g.fillRect(18, by - 50, 200, 6); g.fillStyle = '#f7c81e'; g.fillRect(18, by - 50, 200 * R.overT / 8, 6); }
    // boss göstergesi
    if (B.active && B.state !== 'enter') {
      const bw = 400, bx = W / 2 - bw / 2, y = 100;
      g.fillStyle = '#0a0f22'; g.fillRect(bx - 3, y - 3, bw + 6, 20);
      g.fillStyle = '#3a1720'; g.fillRect(bx, y, bw, 14);
      g.fillStyle = B.phase === 2 ? '#ff3b4f' : B.phase === 1 ? '#ff8a3c' : '#ffcf33'; g.fillRect(bx, y, bw * max(0, B.hp / B.maxHp), 14);
      g.fillStyle = '#0a0f22'; g.fillRect(bx + bw * .33, y, 2, 14); g.fillRect(bx + bw * .66, y, 2, 14);
    }
    for (let i = 0; i < fl.n; i++) { const f = fl.a[i], l = label(f.key), a = f.t > .7 ? max(0, 1 - (f.t - .7) / .35) : 1, s = f.t < .12 ? .7 + f.t * 2.5 : 1; spr(l, clamp(f.x, l.w / 2 + 6, W - l.w / 2 - 6), f.y, 0, s, s, a); }
    if (bannerSpr && S.banner < S.bannerLife) {
      const u = S.banner / S.bannerLife, a = u < .12 ? u / .12 : u > .78 ? (1 - u) / .22 : 1, off = u < .12 ? (1 - u / .12) * -30 : 0;
      spr(bannerSpr, W / 2 + off, H * .36, 0, 1, 1, clamp(a, 0, 1));
    }
    setA(1);
  }
  function render() {
    const tm = S.clock;
    const sh = S.shake * S.shake;
    camX = sh * 15 * sin(tm * 51); camY = sh * 15 * sin(tm * 43 + 1.2);
    if (S.mode === 'paused') { camX = 0; camY = 0; }
    drawBackground();
    const inGame = S.mode === 'play' || S.mode === 'paused' || (S.mode === 'over');
    if (inGame) {
      for (let i = 0; i < pu.n; i++) {
        const p = pu.a[i];
        if (p.scrap) { const w = cos(p.t * 5); spr(A.scrap[p.v], p.x, p.y, p.t * .8, abs(w) * .85 + .2, 1, 1); }
        else { spr(A.puRing, p.x, p.y, p.t * 2.2, 1, 1, 1); const s = 1 + sin(p.t * 5) * .06; spr(A.pu[p.kind], p.x, p.y, sin(p.t * 2) * .12, s, s, 1); }
      }
      drawFx(true);
      for (let i = 0; i < en.n; i++) drawEnemy(en.a[i], tm);
      if (B.active) drawBoss(tm);
      drawBeams();
      for (let i = 0; i < rk.n; i++) { const r = rk.a[i]; drawFlame(A.fPlayer, r.x - sin(r.ang) * 19, r.y + cos(r.ang) * 19, r.ang, .42, .5 + sin(tm * 41 + i) * .08, tm + i * .3); spr(A.rocket, r.x, r.y, r.ang, 1, 1, 1); }
      for (let i = 0; i < pb.n; i++) { const b = pb.a[i]; spr(b.heavy ? A.pbB : A.pbA, b.x, b.y, b.ang, 1, 1, 1); }
      drawPlayer(tm);
      if (S.novaT >= 0) { drawFlame(A.fCool, S.novaX, S.novaY + 36, 0, .9, .9 + sin(tm * 40) * .12, tm); spr(A.nova, S.novaX, S.novaY, 0, 1, 1, 1); }
      for (let i = 0; i < eb.n; i++) { const b = eb.a[i], rs = b.kind === 3 ? b.ang + PI / 2 : b.t * 5; spr(A.eb[b.kind], b.x, b.y, rs, 1, 1, 1); }
      drawFx(false);
      if (S.novaFlash >= 0) {
        const u = S.novaFlash / .55;
        g.setTransform(k, 0, 0, k, camX * k, camY * k);
        setA((1 - u) * .9); g.strokeStyle = '#e9d6ff'; g.lineWidth = 26 * (1 - u) + 2; g.beginPath(); g.arc(S.novaX, S.novaY, S.novaR, 0, TAU); g.stroke();
        setA((1 - u) * .55); g.strokeStyle = '#ffd24d'; g.lineWidth = 6; g.beginPath(); g.arc(S.novaX, S.novaY, S.novaR * .72, 0, TAU); g.stroke();
        setA(1);
      }
      camX = 0; camY = 0;
      if (S.mode === 'play' || S.mode === 'paused') drawHud(tm);
    } else {
      // menü sahnesi
      const y = menuY + sin(tm * 1.25) * 9, x = W / 2 + sin(tm * .55) * 24, tl = cos(tm * .55) * .5;
      for (let i = 0; i < 2; i++) {
        const ex = i ? W - 46 : 46, ey = ((tm * (34 + i * 9) + i * 420) % (H + 120)) - 60;
        spr(A[i ? 'dart' : 'wasp'], ex, ey, sin(tm + i) * .12, .8, .8, 1);
      }
      const fr = clamp(round(tl * 2) + 2, 0, 4);
      drawFlame(A.fPlayer, x - 14, y + 48, tl * .05, 1, 1 + sin(tm * 37) * .08, tm);
      drawFlame(A.fPlayer, x + 14, y + 48, tl * .05, 1, 1 + sin(tm * 37) * .08, tm + .37);
      spr(A.player[fr], x, y, tl * .05, 1.3, 1.3, 1);
    }
    setA(1);
    g.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ---------- yerleşim ve döngü ----------
  function fit() {
    const iw = innerWidth || 600, ih = innerHeight || 900;
    H = clamp(round(W * ih / iw), 900, 1300);
    scale = min(iw / W, ih / H);
    const dpr = min(window.devicePixelRatio || 1, 2);
    stage.style.width = W * scale + 'px'; stage.style.height = H * scale + 'px';
    cv.width = round(W * scale * dpr); cv.height = round(H * scale * dpr);
    k = cv.width / W;
    document.documentElement.style.setProperty('--u', scale + 'px');
    curA = 1; g.globalAlpha = 1; g.imageSmoothingEnabled = true; g.lineCap = 'round';
    Pl.y = clamp(Pl.y, 110, H - 130);
    measureMenu();
  }

  const perf_ = { on: false, cpu: new Float32Array(20000), n: 0 };
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    const real = min(.05, (now - last) / 1000); last = now;
    const c0 = perf_.on ? performance.now() : 0;
    tick(real); render();
    if (perf_.on && perf_.n < perf_.cpu.length) perf_.cpu[perf_.n++] = performance.now() - c0;
  }

  addEventListener('resize', fit);
  bakeSprites(); bakeDigits(); bakeBackgrounds(); fit(); applyLang(); setMode('menu');
  requestAnimationFrame(frame);

  // Arcade smoke testi yeni bir oyun başlatır
  window.__smokeStart = () => startRun(false);

  // test ve hata ayıklama kancası
  window.__game = { S, R, Pl, B, en, eb, pb, pu, Save, perf: perf_, god: false, jump(sector, wave) { R.sector = sector; R.wave = wave; en.clear(); sq.clear(); eb.clear(); bm.clear(); B.active = false; B.dead = true; S.waveState = 'break'; S.waveT = .1; BG.cur = BG.prev = (sector - 1) % THEMES.length; } };
})();
</script>
