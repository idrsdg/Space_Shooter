<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Space Shooter</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #03040c; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; background: #05071a; box-shadow: 0 0 60px rgba(60, 110, 255, .25); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const W = 600, H = 900;
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  let scale = 1;
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    scale = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
    g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  addEventListener('resize', fit); fit();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---- ses ----
  let ac = null, muted = false;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
  function blip(f0, f1, dur, type, vol) {
    if (!ac || muted) return;
    const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(v).connect(ac.destination); o.start(t); o.stop(t + dur);
  }
  function boom(vol, dur) {
    if (!ac || muted) return;
    const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = ac.createBufferSource(), v = ac.createGain(), f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900; v.gain.value = vol;
    s.buffer = b; s.connect(f).connect(v).connect(ac.destination); s.start();
  }

  // ---- durum ----
  let best = 0;
  try { best = +localStorage.getItem('spaceShooterBest') || 0; } catch (e) {}
  const stars = [];
  for (let i = 0; i < 110; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), z: rnd(.25, 1) });
  const S = { mode: 'menu' };
  window.__g = S;

  function reset() {
    Object.assign(S, {
      mode: 'play', t: 0, score: 0, lives: 3, wave: 0, toSpawn: 0, spawnT: 1, waveT: 0, shake: 0, safe: 0, fireT: 0,
      p: { x: W / 2, y: H - 120, tilt: 0 }, shots: [], rocks: [], foes: [], bolts: [], fx: [], rings: [], overT: 0
    });
  }

  function rock(big) {
    const r = big === undefined ? [18, 28, 40][Math.floor(Math.random() * 3)] : big;
    const n = 9 + Math.floor(Math.random() * 4), pts = [];
    for (let i = 0; i < n; i++) pts.push(rnd(.72, 1.08));
    return { x: rnd(40, W - 40), y: -50, r, vx: rnd(-25, 25), vy: rnd(140, 210) + S.wave * 8, a: rnd(0, 6.28), spin: rnd(-2.2, 2.2), pts, hp: r > 30 ? 2 : 1, hit: 0 };
  }
  const foe = () => ({ x: rnd(60, W - 60), y: -40, vy: rnd(95, 135), tx: rnd(60, W - 60), mt: rnd(.5, 1), ft: rnd(.5, 1.1), tilt: 0 });

  function burst(x, y, n, col, sp) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.28), v = rnd(.2, 1) * sp;
      S.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(.35, .9), t: 0, col, s: rnd(1.5, 4) });
    }
    S.rings.push({ x, y, t: 0, r: sp * .22 });
  }

  // ---- girdi ----
  const keys = {};
  let pt = null;
  addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true; audio();
    if (e.key.toLowerCase() === 'm') muted = !muted;
    if (S.mode === 'menu' || (S.mode === 'over' && S.overT > .8 && (e.key === ' ' || e.key === 'Enter' || e.key.toLowerCase() === 'r'))) reset();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) / scale, y: (e.clientY - b.top) / scale }; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); audio();
    if (S.mode === 'menu' || (S.mode === 'over' && S.overT > .8)) { reset(); return; }
    pt = pos(e); try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', e => { if (pt) pt = pos(e); });
  const up = () => { pt = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  // ---- oyun ----
  function hurt() {
    if (S.safe > 0) return;
    S.lives--; S.shake = .45; S.safe = 2.2;
    burst(S.p.x, S.p.y, 40, '#ffd27a', 320); boom(.5, .6);
    if (S.lives <= 0) {
      S.mode = 'over'; S.overT = 0;
      if (S.score > best) { best = S.score; try { localStorage.setItem('spaceShooterBest', best); } catch (e) {} }
    }
  }

  function update(dt) {
    for (const s of stars) { s.y += (40 + 220 * s.z) * dt * s.z; if (s.y > H) { s.y = -2; s.x = rnd(0, W); } }
    for (const f of S.fx || []) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= .97; f.vy *= .97; }
    if (S.fx) { S.fx = S.fx.filter(f => f.t < f.life); for (const r of S.rings) r.t += dt; S.rings = S.rings.filter(r => r.t < .45); }
    if (S.mode === 'over') { S.overT += dt; }
    if (S.mode !== 'play') return;

    S.t += dt; S.shake = Math.max(0, S.shake - dt); S.safe = Math.max(0, S.safe - dt);
    const p = S.p;
    let dx = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
    let dy = (keys['arrowdown'] || keys['s'] ? 1 : 0) - (keys['arrowup'] || keys['w'] ? 1 : 0);
    const px = p.x;
    if (pt) { p.x += (pt.x - p.x) * Math.min(1, dt * 14); p.y += (pt.y - 70 - p.y) * Math.min(1, dt * 14); }
    else { p.x += dx * 380 * dt; p.y += dy * 320 * dt; }
    p.x = clamp(p.x, 34, W - 34); p.y = clamp(p.y, 140, H - 60);
    p.tilt += (clamp((p.x - px) / Math.max(dt, .001) / 380, -1, 1) - p.tilt) * Math.min(1, dt * 10);

    S.fireT -= dt;
    if ((keys[' '] || pt) && S.fireT <= 0) {
      S.fireT = .22; S.shots.push({ x: p.x, y: p.y - 34 }); blip(880, 220, .12, 'square', .05);
    }
    for (const s of S.shots) s.y -= 760 * dt;
    S.shots = S.shots.filter(s => s.y > -30 && !s.dead);

    // dalgalar: belirli sayıda tehlike, sonra kısa mola
    if (S.toSpawn > 0) {
      S.spawnT -= dt;
      if (S.spawnT <= 0) {
        S.spawnT = Math.max(.22, .55 - S.wave * .025); S.toSpawn--;
        if (S.wave > 1 && Math.random() < Math.min(.4, .12 + S.wave * .03)) S.foes.push(foe()); else S.rocks.push(rock());
      }
    } else if (!S.rocks.length && !S.foes.length || (S.waveT += dt) > 3) {
      S.wave++; S.toSpawn = 8 + S.wave * 2; S.spawnT = 1; S.waveT = 0;
    }

    for (const r of S.rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.spin * dt; r.hit = Math.max(0, r.hit - dt); }
    for (const f of S.foes) {
      f.y += f.vy * dt; f.mt -= dt;
      if (f.mt <= 0) { f.mt = rnd(.8, 1.6); f.tx = clamp(f.x + rnd(-170, 170), 50, W - 50); }
      const fx0 = f.x; f.x += (f.tx - f.x) * Math.min(1, dt * 2.2); f.tilt = clamp((f.x - fx0) / Math.max(dt, .001) / 200, -1, 1);
      f.ft -= dt;
      if (f.ft <= 0 && f.y > 0 && f.y < H * .7) { f.ft = 1.25; S.bolts.push({ x: f.x, y: f.y + 26 }); blip(300, 120, .15, 'sawtooth', .035); }
    }
    for (const b of S.bolts) b.y += 430 * dt;

    for (const s of S.shots) {
      for (const r of S.rocks) if (!r.dead && Math.hypot(s.x - r.x, s.y - r.y) < r.r + 6) {
        s.dead = true; r.hp--; r.hit = .1;
        if (r.hp <= 0) { r.dead = true; S.score += 10; burst(r.x, r.y, 14 + r.r / 2, '#c9b39a', 160 + r.r * 3); boom(.25, .3); }
        else burst(s.x, s.y, 5, '#fff', 90);
        break;
      }
      if (!s.dead) for (const f of S.foes) if (!f.dead && Math.hypot(s.x - f.x, s.y - f.y) < 28) {
        s.dead = true; f.dead = true; S.score += 20; burst(f.x, f.y, 26, '#ff7a5c', 260); boom(.3, .4); break;
      }
    }
    for (const r of S.rocks) if (!r.dead && Math.hypot(p.x - r.x, p.y - r.y) < r.r + 20) { if (S.safe <= 0) { r.dead = true; burst(r.x, r.y, 16, '#c9b39a', 200); } hurt(); }
    for (const f of S.foes) if (!f.dead && Math.hypot(p.x - f.x, p.y - f.y) < 44) { if (S.safe <= 0) { f.dead = true; burst(f.x, f.y, 22, '#ff7a5c', 240); } hurt(); }
    for (const b of S.bolts) if (!b.dead && Math.hypot(p.x - b.x, p.y - b.y) < 22) { b.dead = true; hurt(); }

    S.rocks = S.rocks.filter(r => !r.dead && r.y < H + 70);
    S.foes = S.foes.filter(f => !f.dead && f.y < H + 60);
    S.bolts = S.bolts.filter(b => !b.dead && b.y < H + 30);
  }

  // ---- çizim ----
  function ship(x, y, tilt, col1, col2, flip, flame) {
    g.save(); g.translate(x, y); g.scale(1 - Math.abs(tilt) * .22, flip ? -1 : 1);
    if (flame) {
      const fl = 18 + Math.random() * 14, gr = g.createLinearGradient(0, 24, 0, 24 + fl);
      gr.addColorStop(0, '#fff7c2'); gr.addColorStop(.4, '#ff9d2e'); gr.addColorStop(1, 'rgba(255,60,0,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(-9, 22); g.lineTo(0, 24 + fl); g.lineTo(9, 22); g.fill();
    }
    const gr = g.createLinearGradient(-30, 0, 30, 0); gr.addColorStop(0, col2); gr.addColorStop(.5, col1); gr.addColorStop(1, col2);
    g.fillStyle = gr; g.beginPath();
    g.moveTo(0, -36); g.lineTo(9, -10); g.lineTo(32, 16); g.lineTo(30, 26); g.lineTo(10, 20); g.lineTo(0, 26); g.lineTo(-10, 20); g.lineTo(-30, 26); g.lineTo(-32, 16); g.lineTo(-9, -10);
    g.closePath(); g.fill(); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = flip ? '#3b0d0d' : '#7fe3ff'; g.beginPath(); g.ellipse(0, -8, 5, 11, 0, 0, 6.29); g.fill();
    g.restore();
  }

  function draw() {
    g.save();
    if (S.shake > 0) g.translate(rnd(-1, 1) * S.shake * 22, rnd(-1, 1) * S.shake * 22);
    const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0a0d2a'); bg.addColorStop(.6, '#12093a'); bg.addColorStop(1, '#1b0a2e');
    g.fillStyle = bg; g.fillRect(-30, -30, W + 60, H + 60);
    for (const s of stars) { g.globalAlpha = .3 + s.z * .7; g.fillStyle = s.z > .8 ? '#bfe0ff' : '#fff'; g.fillRect(s.x, s.y, s.z * 2.2, s.z * 2.2 + s.z * 5); }
    g.globalAlpha = 1;

    if (S.mode !== 'menu') {
      for (const r of S.rocks) {
        g.save(); g.translate(r.x, r.y); g.rotate(r.a);
        const gr = g.createRadialGradient(-r.r * .3, -r.r * .3, r.r * .1, 0, 0, r.r);
        gr.addColorStop(0, r.hit ? '#fff' : '#b9a48d'); gr.addColorStop(1, '#4d4138');
        g.fillStyle = gr; g.beginPath();
        r.pts.forEach((k, i) => { const a = i / r.pts.length * 6.283; g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r.r * k, Math.sin(a) * r.r * k); });
        g.closePath(); g.fill(); g.strokeStyle = '#2a221d'; g.lineWidth = 2; g.stroke();
        g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.arc(r.r * .25, r.r * .1, r.r * .2, 0, 6.29); g.arc(-r.r * .3, r.r * .35, r.r * .12, 0, 6.29); g.fill();
        g.restore();
      }
      for (const f of S.foes) ship(f.x, f.y, f.tilt, '#ff6b5c', '#7a1622', true, true);
      g.lineCap = 'round';
      for (const s of S.shots) { g.strokeStyle = 'rgba(80,220,255,.35)'; g.lineWidth = 10; g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x, s.y + 22); g.stroke(); g.strokeStyle = '#e6fbff'; g.lineWidth = 3.5; g.stroke(); }
      for (const b of S.bolts) { g.strokeStyle = 'rgba(255,80,60,.4)'; g.lineWidth = 10; g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x, b.y - 20); g.stroke(); g.strokeStyle = '#ffe1c9'; g.lineWidth = 3.5; g.stroke(); }
      if (S.mode === 'play' && (S.safe <= 0 || Math.floor(S.safe * 12) % 2)) ship(S.p.x, S.p.y, S.p.tilt, '#e8f1ff', '#5d7fd6', false, true);
      for (const r of S.rings) { const k = r.t / .45; g.globalAlpha = 1 - k; g.strokeStyle = '#fff3c4'; g.lineWidth = 4 * (1 - k) + 1; g.beginPath(); g.arc(r.x, r.y, r.r * (.3 + k * 1.3), 0, 6.29); g.stroke(); }
      for (const f of S.fx) { g.globalAlpha = 1 - f.t / f.life; g.fillStyle = f.col; g.beginPath(); g.arc(f.x, f.y, f.s, 0, 6.29); g.fill(); }
      g.globalAlpha = 1;
    }
    g.restore();

    g.textBaseline = 'top'; g.fillStyle = '#fff';
    if (S.mode !== 'menu') {
      g.font = '700 26px system-ui, sans-serif'; g.textAlign = 'left'; g.fillText('Skor: ' + S.score, 20, 18);
      g.textAlign = 'right'; g.font = '600 18px system-ui, sans-serif'; g.fillStyle = '#9fb4ff'; g.fillText('Dalga ' + Math.max(1, S.wave), W - 20, 52);
      for (let i = 0; i < S.lives; i++) { g.save(); g.translate(W - 34 - i * 34, 34); g.scale(.4, .4); ship(0, 0, 0, '#e8f1ff', '#5d7fd6', false, false); g.restore(); }
    }
    g.textAlign = 'center';
    if (S.mode === 'menu') {
      g.fillStyle = '#fff'; g.font = '800 62px system-ui, sans-serif'; g.fillText('SPACE', W / 2, 250); g.fillStyle = '#6fd6ff'; g.fillText('SHOOTER', W / 2, 318);
      ship(W / 2, 500 + Math.sin(performance.now() / 400) * 8, 0, '#e8f1ff', '#5d7fd6', false, true);
      g.fillStyle = '#fff'; g.font = '600 24px system-ui, sans-serif';
      if (Math.floor(performance.now() / 500) % 2) g.fillText('Başlamak için dokun ya da bir tuşa bas', W / 2, 630);
      g.fillStyle = '#9fb4ff'; g.font = '500 18px system-ui, sans-serif';
      g.fillText('Yön tuşları ya da WASD: hareket   Boşluk: ateş', W / 2, 700);
      g.fillText('Telefonda: parmağını sürükle, gemi kendi ateş eder', W / 2, 728);
      if (best) g.fillText('En iyi skor: ' + best, W / 2, 780);
    }
    if (S.mode === 'over') {
      g.fillStyle = 'rgba(3,4,12,.6)'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#ff6b5c'; g.font = '800 58px system-ui, sans-serif'; g.fillText('OYUN BİTTİ', W / 2, 320);
      g.fillStyle = '#fff'; g.font = '700 32px system-ui, sans-serif'; g.fillText('Skor: ' + S.score, W / 2, 410);
      g.fillStyle = '#9fb4ff'; g.font = '600 22px system-ui, sans-serif'; g.fillText('En iyi skor: ' + best, W / 2, 458);
      if (S.overT > .8) { g.fillStyle = '#fff'; g.fillText('Yeniden başlamak için dokun ya da R', W / 2, 540); }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  window.__step = (n, dt) => { for (let i = 0; i < n; i++) update(dt || 1 / 60); draw(); };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
