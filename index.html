<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Space Shooter</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #eef3ff; --dim: #a9b6d6; --panel: #121830; --line: #3a4775; --accent: #ff8a3c; --cool: #4fcdf4; --good: #4fdc78; --bad: #ff5a55;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  #load { position: absolute; inset: 0; z-index: 30; background: #05070f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  #load h1, #scrMenu h1 { margin: 0; font-size: clamp(40px, 9vmin, 76px); line-height: .95; font-weight: 900; letter-spacing: 2px; }
  h1 span { display: block; color: var(--cool); }
  #bar { width: min(420px, 82vw); height: 12px; background: var(--panel); border: 2px solid var(--line); border-radius: 7px; overflow: hidden; }
  #barIn { height: 100%; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; }
  #loadTxt { color: var(--dim); font-size: 15px; min-height: 20px; font-variant-numeric: tabular-nums; }
  #loadErr { color: var(--bad); font-size: 16px; max-width: 460px; display: none; }

  .scr { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: clamp(7px, 1.5vh, 13px);
    padding: calc(14px + var(--sat)) calc(16px + var(--sar)) calc(14px + var(--sab)) calc(16px + var(--sal)); text-align: center; overflow-y: auto; touch-action: pan-y; }
  .scr.on { display: flex; }
  .scr.dim { background: rgba(5, 7, 18, .8); }
  #scrMenu { background: linear-gradient(90deg, rgba(5,7,18,.86) 0%, rgba(5,7,18,.5) 44%, rgba(5,7,18,0) 72%); align-items: flex-start; padding-left: calc(clamp(20px, 7vw, 96px) + var(--sal)); text-align: left; }
  h2 { margin: 0 0 4px; font-size: clamp(30px, 6vmin, 46px); font-weight: 900; }
  .tag { color: var(--dim); font-size: clamp(15px, 2.4vmin, 19px); margin: 2px 0 10px; max-width: 360px; }
  .btn { width: min(320px, 84vw); min-height: clamp(44px, 7vh, 54px); flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; font-size: clamp(16px, 2.6vmin, 20px); font-weight: 750; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #1d0d02; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; width: min(320px, 84vw); flex: none; }
  .mini { flex: 1; white-space: nowrap; padding: 0 4px; min-height: 44px; background: var(--panel); border: 2px solid var(--line); border-radius: 9px; font-size: 14px; font-weight: 700; }
  .stat { color: var(--dim); font-size: 16px; }
  .stat b { color: var(--ink); }
  #overScore { font-size: clamp(38px, 8vmin, 58px); font-weight: 900; font-variant-numeric: tabular-nums; }
  #overRec { color: var(--accent); font-weight: 800; font-size: 18px; min-height: 22px; }
  #upList { width: min(500px, 92vw); display: flex; flex-direction: column; gap: 7px; flex: none; }
  .up { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 7px 10px; text-align: left; }
  .up > div { flex: 1; min-width: 0; }
  .up strong { display: block; font-size: 16px; }
  .up small { display: block; color: var(--dim); font-size: 13px; line-height: 1.2; }
  .pips { display: flex; gap: 3px; margin-top: 4px; }
  .pips i { width: 20px; height: 5px; background: var(--line); border-radius: 2px; }
  .pips i.f { background: var(--cool); }
  .buy { min-width: 76px; min-height: 44px; background: var(--accent); color: #1d0d02; border: 0; border-radius: 8px; font-weight: 850; font-size: 16px; }
  .buy:disabled { background: #2a3258; color: var(--dim); cursor: default; }
  .allGames { color: var(--dim); font-size: 14px; font-weight: 650; padding: 6px 10px; text-decoration: underline; text-underline-offset: 3px; touch-action: manipulation; }
  #helpBody { width: min(520px, 92vw); text-align: left; font-size: 15px; line-height: 1.35; }
  #helpBody p { margin: 0 0 8px; }
  #helpBody b { color: var(--cool); }

  #hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: none; font-variant-numeric: tabular-nums; }
  #hud.on { display: block; }
  .hTL { position: absolute; top: calc(10px + var(--sat)); left: calc(12px + var(--sal)); }
  #hScore { font-size: clamp(22px, 4vmin, 30px); font-weight: 900; line-height: 1; text-shadow: 0 1px 2px #000; }
  #hCombo { font-size: 15px; font-weight: 800; color: var(--accent); min-height: 18px; margin-top: 2px; text-shadow: 0 1px 2px #000; }
  .hTC { position: absolute; top: calc(10px + var(--sat)); left: 50%; transform: translateX(-50%); text-align: center; font-size: 13px; font-weight: 750; color: var(--dim); white-space: nowrap; text-shadow: 0 1px 2px #000; }
  #hBoss { display: none; position: absolute; top: calc(52px + var(--sat)); left: 50%; transform: translateX(-50%); width: min(520px, 66vw); text-align: center; }
  #hBossName { font-size: 13px; font-weight: 850; color: #ffd9c9; margin-bottom: 3px; text-shadow: 0 1px 2px #000; }
  #hBossBar { height: 9px; background: rgba(16,20,40,.9); border: 1px solid #6b3340; border-radius: 4px; overflow: hidden; }
  #hBossIn { height: 100%; width: 100%; background: var(--bad); transform-origin: left; }
  .hBL { position: absolute; left: calc(12px + var(--sal)); bottom: calc(12px + var(--sab)); display: flex; flex-direction: column; gap: 4px; background: rgba(8,11,24,.62); border-radius: 8px; padding: 6px 8px; font-size: 12px; font-weight: 750; color: var(--dim); }
  .hRow { display: flex; align-items: center; gap: 5px; min-height: 12px; }
  .hRow span { width: 44px; }
  .pip { width: 12px; height: 8px; border-radius: 2px; background: #2b3354; }
  .pip.h { background: var(--good); } .pip.s { background: var(--cool); } .pip.w { background: var(--accent); } .pip.r { background: var(--bad); }
  #hMsg { position: absolute; left: 50%; top: 27%; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; opacity: 0; font-weight: 900; font-size: clamp(24px, 5vmin, 40px); text-shadow: 0 2px 3px #000; }
  #hMsg small { display: block; font-size: .55em; color: var(--cool); font-weight: 800; }
  #hMsg.warn { color: var(--bad); } #hMsg.warn small { color: #ffe9dc; }
  #hPick { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); font-weight: 850; font-size: 17px; color: #ffe07a; opacity: 0; text-shadow: 0 1px 2px #000; white-space: nowrap; }
  #hurt { position: absolute; inset: 0; border: 7px solid var(--bad); opacity: 0; pointer-events: none; }
  .hudBtn { position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center; background: rgba(16,22,48,.84); border: 2px solid var(--line); padding: 0; touch-action: none; }
  #btnPause { top: calc(10px + var(--sat)); right: calc(12px + var(--sar)); width: 46px; height: 46px; border-radius: 10px; }
  #btnPause i { display: block; width: 5px; height: 17px; margin: 0 3px; background: var(--ink); border-radius: 2px; }
  #btnNova { right: calc(14px + var(--sar)); bottom: calc(14px + var(--sab)); width: 78px; height: 78px; border-radius: 50%; border-color: var(--accent); flex-direction: column; font-weight: 800; font-size: 12px; line-height: 1.1; }
  #btnNova b { font-size: 24px; color: var(--accent); }
  #btnNova.empty { opacity: .4; border-color: var(--line); }
  @media (max-height: 480px) {
    .scr { gap: 5px; padding-top: calc(6px + var(--sat)); padding-bottom: calc(6px + var(--sab)); justify-content: safe center; }
    #scrMenu h1 { font-size: 28px; } #scrMenu h1 span { display: inline; margin-left: 8px; }
    .tag { display: none; } h2 { font-size: 24px; margin: 0; }
    .btn { min-height: 36px; font-size: 15px; } .mini { min-height: 36px; font-size: 13px; }
    .stat { font-size: 13px; } .allGames { padding: 2px 8px; font-size: 13px; }
    #overScore { font-size: 28px; } #overRec { min-height: 0; font-size: 14px; }
    #scrOver .stat { display: inline; }
    .up { padding: 3px 8px; } .up small { display: none; } .up strong { font-size: 14px; } .pips { margin-top: 2px; }
    .buy { min-height: 34px; font-size: 14px; } #upList { gap: 4px; }
    #btnNova { width: 62px; height: 62px; } #btnNova b { font-size: 19px; }
    .hBL { padding: 3px 6px; gap: 2px; font-size: 10px; } .hRow span { width: 36px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="hTL"><div id="hScore">0</div><div id="hCombo"></div></div>
    <div class="hTC" id="hWave"></div>
    <div id="hBoss"><div id="hBossName"></div><div id="hBossBar"><div id="hBossIn"></div></div></div>
    <div class="hBL">
      <div class="hRow"><span data-t="hHull"></span><span id="hHull" style="display:flex;gap:3px;width:auto"></span></div>
      <div class="hRow"><span data-t="hShield"></span><span id="hShield" style="display:flex;gap:3px;width:auto"></span></div>
      <div class="hRow"><span data-t="hGun"></span><span id="hGun" style="display:flex;gap:3px;width:auto"></span></div>
      <div class="hRow"><span data-t="hRkt"></span><span id="hRkt" style="display:flex;gap:3px;width:auto"></span></div>
    </div>
    <div id="hMsg"></div>
    <div id="hPick"></div>
    <div id="hurt"></div>
    <button id="btnPause" class="hudBtn" data-act="pause"><i></i><i></i></button>
    <button id="btnNova" class="hudBtn"><b id="novaN">2</b><span data-t="bomb"></span></button>
  </div>

  <section id="scrMenu" class="scr">
    <h1>SPACE<span>SHOOTER</span></h1>
    <div class="tag" data-t="tag"></div>
    <button class="btn pri" data-act="continue" id="btnCont"></button>
    <button class="btn" data-act="new" id="btnNew" data-t="play"></button>
    <button class="btn" data-act="hangar" data-t="hangar"></button>
    <div class="row">
      <button class="mini" data-act="help" data-t="how"></button>
      <button class="mini" data-act="sound" data-role="sound"></button>
      <button class="mini" data-act="lang" data-role="lang"></button>
    </div>
    <div class="stat"><span data-t="best"></span>: <b id="menuBest">0</b></div>
    <a class="allGames" href="../games/" data-t="allGames"></a>
  </section>

  <section id="scrHangar" class="scr dim">
    <h2 data-t="hangar"></h2>
    <div class="stat"><span data-t="scrap"></span>: <b id="hangarScrap">0</b></div>
    <div id="upList"></div>
    <button class="btn" data-act="back" data-t="back"></button>
  </section>

  <section id="scrHelp" class="scr dim">
    <h2 data-t="how"></h2>
    <div id="helpBody"></div>
    <button class="btn" data-act="back" data-t="back"></button>
  </section>

  <section id="scrPause" class="scr dim">
    <h2 data-t="paused"></h2>
    <button class="btn pri" data-act="resume" data-t="resume"></button>
    <button class="btn" data-act="restart" data-t="restart"></button>
    <div class="row">
      <button class="mini" data-act="sound" data-role="sound"></button>
      <button class="mini" data-act="lang" data-role="lang"></button>
    </div>
    <button class="btn" data-act="quit" data-t="quit"></button>
    <a class="allGames" href="../games/" data-t="allGames"></a>
  </section>

  <section id="scrOver" class="scr dim">
    <h2 data-t="over"></h2>
    <div id="overScore">0</div>
    <div id="overRec"></div>
    <div class="stat"><span data-t="best"></span>: <b id="overBest">0</b></div>
    <div class="stat"><span data-t="reached"></span>: <b id="overSector">1</b></div>
    <div class="stat"><span data-t="scrapGot"></span>: <b id="overScrap">0</b></div>
    <button class="btn pri" data-act="new" data-t="again"></button>
    <button class="btn" data-act="hangar" data-t="hangar"></button>
    <button class="btn" data-act="menu" data-t="menu"></button>
  </section>

  <div id="load">
    <h1>SPACE<span>SHOOTER</span></h1>
    <div id="bar"><div id="barIn"></div></div>
    <div id="loadTxt"></div>
    <div id="loadErr"></div>
  </div>
</div>
<script src="js/three.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
